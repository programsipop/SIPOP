# netlify.toml — configuração de build para o Netlify

[build]
  command   = "npm run build"
  publish   = "_site"

[build.environment]
  NODE_VERSION = "18"

# Redireciona /publications para /publications/index.html (URLs limpas)
[[redirects]]
  from   = "/publications"
  to     = "/publications/index.html"
  status = 200

[[redirects]]
  from   = "/technical-review"
  to     = "/technical-review/index.html"
  status = 200

[[redirects]]
  from   = "/testimonials"
  to     = "/testimonials/index.html"
  status = 200

# Versão em português (subpasta /pt/)
[[redirects]]
  from   = "/pt"
  to     = "/pt/index.html"
  status = 200

[[redirects]]
  from   = "/pt/publications"
  to     = "/pt/publications/index.html"
  status = 200

[[redirects]]
  from   = "/pt/technical-review"
  to     = "/pt/technical-review/index.html"
  status = 200

[[redirects]]
  from   = "/pt/testimonials"
  to     = "/pt/testimonials/index.html"
  status = 200

# Versão em espanhol (subpasta /es/)
[[redirects]]
  from   = "/es"
  to     = "/es/index.html"
  status = 200

[[redirects]]
  from   = "/es/publications"
  to     = "/es/publications/index.html"
  status = 200

[[redirects]]
  from   = "/es/technical-review"
  to     = "/es/technical-review/index.html"
  status = 200

[[redirects]]
  from   = "/es/testimonials"
  to     = "/es/testimonials/index.html"
  status = 200
